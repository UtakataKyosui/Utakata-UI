name: Quality
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_cache_mode:
        description: Browser verification cache mode
        type: choice
        options: [warm, cold]
        default: warm
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.scope.outputs.base }}
      checks: ${{ steps.scope.outputs.checks }}
      build: ${{ steps.scope.outputs.build }}
      types: ${{ steps.scope.outputs.types }}
      tests: ${{ steps.scope.outputs.tests }}
      markup: ${{ steps.scope.outputs.markup }}
      browser: ${{ steps.scope.outputs.browser }}
      docs: ${{ steps.scope.outputs.docs }}
      react: ${{ steps.scope.outputs.react }}
      cli: ${{ steps.scope.outputs.cli }}
      fallow: ${{ steps.scope.outputs.fallow }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scope, aggregate and evidence gates (no dependency install)
        run: node --test scripts/ci-scope.test.mjs scripts/ci-gate.test.mjs scripts/required-browser-checks.test.mjs scripts/release-readiness.test.mjs scripts/publish-npm-token.test.mjs scripts/prior-verification.test.mjs
      - name: Select required gates
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs
      - name: Agent infrastructure (no dependency install)
        if: steps.scope.outputs.agents == 'true'
        run: node --test scripts/agent-hooks.test.mjs

  checks:
    needs: scope
    if: needs.scope.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      - name: Biome (changed files on PRs)
        env:
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          if [[ -n "$BASE" ]]; then
            pnpm exec biome ci . --vcs-enabled=true --vcs-client-kind=git --changed --since="$BASE" --no-errors-on-unmatched
          else
            pnpm exec biome ci .
          fi
      - name: Type check
        if: needs.scope.outputs.types == 'true'
        run: pnpm typecheck
      - name: Markuplint and detection controls
        if: needs.scope.outputs.markup == 'true'
        env:
          CI_DIFF_BASE: ${{ needs.scope.outputs.base }}
        run: pnpm lint:markup

  unit:
    needs: scope
    if: needs.scope.outputs.tests == 'true' || needs.scope.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      - name: Unit and jsdom accessibility tests (single run)
        if: needs.scope.outputs.tests == 'true'
        env:
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          if [[ -n "$BASE" ]]; then
            pnpm exec vitest run --changed "$BASE" --passWithNoTests
          else
            pnpm test
          fi
      - name: Dedicated registry CLI tests
        if: needs.scope.outputs.cli == 'true'
        run: pnpm test:cli

  build:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          # Invalidate downloads when installation policy changes.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            .github/workflows/quality.yml
      - name: Install build dependencies with native diagnostics
        run: |
          pnpm install --frozen-lockfile --reporter=ndjson > "$RUNNER_TEMP/pnpm-install.ndjson" || {
            tail -n 30 "$RUNNER_TEMP/pnpm-install.ndjson"
            exit 1
          }
      - name: Build React
        if: needs.scope.outputs.react == 'true'
        run: pnpm --filter @utakata-ui/react build
      - name: Cache consumer npm downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: consumer-npm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/verify-react-package.mjs') }}
      - name: Verify packed public types and SSR
        if: needs.scope.outputs.react == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/react-consumer"
          npm pack ./packages/react --pack-destination "$RUNNER_TEMP/react-consumer"
          node scripts/verify-react-package.mjs "$RUNNER_TEMP"/react-consumer/*.tgz
      - name: Verify packed dedicated CLI
        if: needs.scope.outputs.cli == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cli-consumer"
          pnpm --filter @utakata-ui/cli pack --pack-destination "$RUNNER_TEMP/cli-consumer"
          node scripts/verify-cli-package.mjs "$RUNNER_TEMP"/cli-consumer/*.tgz

  docs:
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          # Keep the complete Docs toolchain store separate from other jobs.
          # Include workflow policy to invalidate the previous failing store.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            .github/workflows/quality.yml
      - name: Install build dependencies with native diagnostics
        run: |
          pnpm install --frozen-lockfile --reporter=ndjson > "$RUNNER_TEMP/pnpm-install.ndjson" || {
            tail -n 30 "$RUNNER_TEMP/pnpm-install.ndjson"
            exit 1
          }
      - name: Verify Docs native compiler after install
        if: needs.scope.outputs.docs == 'true'
        run: node scripts/check-docs-compiler.mjs
      - name: Build React and Docs
        run: pnpm build:docs

  browser-accessibility:
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    uses: ./.github/workflows/browser.yml
    with:
      cache_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_cache_mode || 'warm' }}

  fallow:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.fallow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: fallow-rs/fallow@v3.38.1
        with:
          command: audit
          version: "3.38.1"
          fail-on-issues: "true"
          comment: "false"
          review-comments: "false"
          sarif: "false"

  # Preserve the existing required-check name, including docs-only PRs.
  # Skipped irrelevant jobs are allowed; a failed scope or gate cannot pass.
  accessibility:
    needs: [scope, checks, unit, build, docs, browser-accessibility, fallow]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Require all applicable gates
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-gate.mjs
