name: Release CLI
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "verify only, publish with OIDC, or publish with npm Environment NPM_TOKEN"
        type: choice
        required: true
        default: verify
        options: [verify, oidc, token]
      full_verification:
        description: "Rerun every verification gate instead of reusing unchanged main evidence"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [packages/cli/package.json]
permissions:
  contents: read
concurrency:
  group: release-cli
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select package.json version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-version.mjs cli
  prior:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.prior.outputs.checks }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse unchanged verification from main
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_VERIFICATION: ${{ inputs.full_verification }}
        run: node scripts/prior-verification.mjs release-cli.yml checks
  verify:
    needs: prior
    if: needs.prior.outputs.checks == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            .github/workflows/release-cli.yml
      - name: Install release dependencies with native diagnostics
        run: |
          pnpm install --frozen-lockfile --reporter=ndjson > "$RUNNER_TEMP/pnpm-install.ndjson" || {
            tail -n 30 "$RUNNER_TEMP/pnpm-install.ndjson"
            exit 1
          }
      - name: Verify Docs native compiler after install
        run: node scripts/check-docs-compiler.mjs
      - name: Quality checks
        run: pnpm check
  release:
    needs: [version, prior, verify]
    # A reused gate is skipped here only because prior found unchanged passing evidence.
    if: >-
      !cancelled() && needs.prior.result == 'success' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.prior.outputs.checks == 'reuse'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only publishing runs use the protected npm Environment and its secrets.
    environment: ${{ (github.event_name == 'push' || inputs.release_mode != 'verify') && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate main release ref
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            .github/workflows/release-cli.yml
      - name: Check npm supports trusted publishing
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("npm >= 11.5.1 is required for trusted publishing");
            }
          '
      - name: Install release dependencies with native diagnostics
        run: |
          pnpm install --frozen-lockfile --reporter=ndjson > "$RUNNER_TEMP/pnpm-install.ndjson" || {
            tail -n 30 "$RUNNER_TEMP/pnpm-install.ndjson"
            exit 1
          }
      - name: Pack and test dedicated CLI in an isolated consumer
        run: |
          mkdir -p "$RUNNER_TEMP/cli-release"
          pnpm --filter @utakata-ui/cli pack --pack-destination "$RUNNER_TEMP/cli-release"
          node scripts/verify-cli-package.mjs "$RUNNER_TEMP/cli-release/utakata-ui-cli-${{ needs.version.outputs.version }}.tgz"
      - name: Publish with npm trusted publishing
        if: github.event_name == 'push' || inputs.release_mode == 'oidc'
        run: npm publish "$RUNNER_TEMP/cli-release/utakata-ui-cli-${{ needs.version.outputs.version }}.tgz" --access public --provenance --tag latest --ignore-scripts
      - name: Publish with npm Environment token
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'token'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-token.mjs "$RUNNER_TEMP/cli-release/utakata-ui-cli-${{ needs.version.outputs.version }}.tgz"
