name: Release MCP
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "verify only, publish with OIDC, or publish with npm Environment NPM_TOKEN"
        type: choice
        required: true
        default: verify
        options: [verify, oidc, token]
      full_verification:
        description: "Rerun every verification gate instead of reusing unchanged main evidence"
        type: boolean
        default: false
  push:
    tags:
      - "mcp-v*"
permissions:
  contents: read
concurrency:
  group: release-mcp
  cancel-in-progress: false
jobs:
  prior:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.prior.outputs.checks }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse unchanged verification from main
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_VERIFICATION: ${{ inputs.full_verification }}
        run: node scripts/prior-verification.mjs release-mcp.yml checks
  verify:
    needs: prior
    if: needs.prior.outputs.checks == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            .github/workflows/release-mcp.yml
      - name: Install release dependencies with native diagnostics
        run: |
          pnpm install --frozen-lockfile --reporter=ndjson > "$RUNNER_TEMP/pnpm-install.ndjson" || {
            tail -n 30 "$RUNNER_TEMP/pnpm-install.ndjson"
            exit 1
          }
      - name: Verify Docs native compiler after install
        run: node scripts/check-docs-compiler.mjs
      - name: Quality checks
        run: pnpm check
  release:
    needs: [prior, verify]
    # A reused gate is skipped here only because prior found unchanged passing evidence.
    if: >-
      !cancelled() && needs.prior.result == 'success' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.prior.outputs.checks == 'reuse'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only publishing runs use the protected npm Environment and its secrets.
    environment: ${{ (github.event_name == 'push' || inputs.release_mode != 'verify') && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/mcp/package.json"));
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error("MCP releases require a stable version");
            }
            if (process.env.EVENT_NAME === "push" && process.env.REF_NAME !== `mcp-v${version}`) {
              throw new Error("Release tag must match mcp-vX.Y.Z");
            }
          '
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            .github/workflows/release-mcp.yml
      - name: Check npm supports trusted publishing
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("npm >= 11.5.1 is required for trusted publishing");
            }
          '
      - name: Install release dependencies with native diagnostics
        run: |
          pnpm install --frozen-lockfile --reporter=ndjson > "$RUNNER_TEMP/pnpm-install.ndjson" || {
            tail -n 30 "$RUNNER_TEMP/pnpm-install.ndjson"
            exit 1
          }
      - name: Pack and test MCP in an isolated consumer
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-release" "$RUNNER_TEMP/react-for-mcp"
          pnpm --filter @utakata-ui/react pack --pack-destination "$RUNNER_TEMP/react-for-mcp"
          pnpm --filter @utakata-ui/mcp pack --pack-destination "$RUNNER_TEMP/mcp-release"
          node scripts/verify-mcp-package.mjs "$RUNNER_TEMP"/mcp-release/*.tgz "$RUNNER_TEMP"/react-for-mcp/*.tgz
      - name: Require published React dependency
        if: github.event_name == 'push' || inputs.release_mode != 'verify'
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/react/package.json"));
            execFileSync("npm", ["view", `@utakata-ui/react@${version}`, "version", "--registry=https://registry.npmjs.org/"], { stdio: "inherit" });
          '
      - name: Publish with npm trusted publishing
        if: github.event_name == 'push' || inputs.release_mode == 'oidc'
        run: npm publish "$RUNNER_TEMP"/mcp-release/*.tgz --access public --provenance --tag latest --ignore-scripts
      - name: Publish with npm Environment token
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'token'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-token.mjs "$RUNNER_TEMP"/mcp-release/*.tgz
